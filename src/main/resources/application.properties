spring.application.name=zomato_alike
# === Database Connection ===
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_app
spring.datasource.username=root
spring.datasource.password=root1234

# === JPA / Hibernate ===
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.hibernate.ddl-auto=update



# Optional: Format SQL in logs
spring.jpa.properties.hibernate.format_sql=true

# Optional: Naming strategy (optional, for table/column names)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# === Seed data (data.sql) ===
# Run data.sql after Hibernate creates/updates the schema, and always run it
# (by default Spring Boot only auto-runs data.sql for embedded databases).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always



#file upload configurations:
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


restaurant.file.path=uploads/restaurant_banner